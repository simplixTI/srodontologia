  <rect width="180" height="180" rx="38" fill="#000"/>
  <rect width="180" height="180" rx="38" fill="url(#halo)"/>
  <rect width="180" height="180" rx="38" fill="url(#sh)"/>

  <!-- S -->
  <path d="M78 50
