        stroke-linecap="round" fill="none"/>

  <!-- R -->
  <path d="M112 50 L112 132
           M112 50 L134 50
           Q152 50 152 70
           Q152 90 134 90
           L112 90
           M134 90 L152 132"
        stroke="url(#g)" stroke-width="12"
